{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docmost-openviking-sync.fullname" . }}
spec:
  type: {{ .Values.webhook.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "docmost-openviking-sync.name" . }}
  ports:
    - name: webhook
      port: {{ .Values.webhook.port }}
      targetPort: {{ .Values.webhook.port }}
{{- end }}
